name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build & sanity check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import sanity check
        env:
          JWT_SECRET_KEY: ci-test-secret
          # rag_engine.py constructs the Gemini client classes at import time, which
          # validates that *some* non-empty API key string is present (but does not
          # call out to Google) — a dummy value is enough to satisfy that check.
          GEMINI_API_KEY: ci-test-key
        run: python -c "import backend.main"

      - name: Build Docker image
        run: docker build -t ai-auditor-assistant:ci .

  deploy:
    name: Deploy to Render
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        run: curl --fail --silent --show-error -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
